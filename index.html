<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Savitri Success Library - Face Attendance</title>

<style>
*{box-sizing:border-box}
body{
  margin:0;
  font-family:Arial,sans-serif;
  background:#f5f7fb;
  color:#222;
}
.hidden{display:none!important}

.mode-screen{
  min-height:100vh;
  display:flex;
  justify-content:center;
  align-items:center;
  padding:20px;
}
.mode-box{
  width:100%;
  max-width:500px;
  background:#fff;
  padding:30px;
  border-radius:20px;
  box-shadow:0 10px 30px rgba(0,0,0,.12);
  text-align:center;
}
.mode-box h1{margin-bottom:25px}

.mode-btn{
  width:100%;
  padding:18px;
  margin:12px 0;
  border:0;
  border-radius:14px;
  background:#2563eb;
  color:#fff;
  font-size:18px;
  cursor:pointer;
}
.mode-btn:hover{opacity:.9}

.container{
  max-width:1100px;
  margin:auto;
  padding:20px;
}

.header{
  background:#fff;
  padding:20px;
  border-radius:16px;
  margin-bottom:20px;
  display:flex;
  justify-content:space-between;
  align-items:center;
  gap:10px;
  flex-wrap:wrap;
  box-shadow:0 5px 20px rgba(0,0,0,.08);
}

.card{
  background:#fff;
  padding:20px;
  border-radius:16px;
  margin-bottom:20px;
  box-shadow:0 5px 20px rgba(0,0,0,.07);
}

input,button{
  font:inherit;
}
input{
  width:100%;
  padding:12px;
  margin:8px 0;
  border:1px solid #ddd;
  border-radius:10px;
}

.btn{
  padding:11px 16px;
  border:0;
  border-radius:10px;
  cursor:pointer;
  background:#2563eb;
  color:#fff;
  margin:5px;
}
.btn-danger{background:#dc2626}
.btn-success{background:#16a34a}
.btn-secondary{background:#64748b}

table{
  width:100%;
  border-collapse:collapse;
}
th,td{
  padding:10px;
  border-bottom:1px solid #eee;
  text-align:left;
}

.stats{
  display:grid;
  grid-template-columns:repeat(auto-fit,minmax(180px,1fr));
  gap:15px;
}
.stat{
  background:#fff;
  padding:20px;
  border-radius:15px;
  box-shadow:0 5px 15px rgba(0,0,0,.06);
}
.stat h2{margin:0}

video{
  width:100%;
  max-width:500px;
  border-radius:15px;
  background:#000;
}

.toast{
  position:fixed;
  right:20px;
  bottom:20px;
  background:#222;
  color:#fff;
  padding:14px 18px;
  border-radius:10px;
  display:none;
  z-index:9999;
}
</style>
</head>

<body>

<!-- MODE SCREEN -->
<div id="modeScreen" class="mode-screen">
  <div class="mode-box">
    <h1>Savitri Success Library</h1>
    <p>Face Attendance System</p>

    <button class="mode-btn" onclick="enterAdminMode()">
      🛡️ Admin Panel
    </button>

    <button class="mode-btn" onclick="enterKioskMode()">
      📷 Attendance
    </button>
  </div>
</div>


<!-- ADMIN PANEL -->
<div id="adminPanel" class="hidden">
  <div class="container">

    <div class="header">
      <div>
        <h2>Savitri Success Library</h2>
        <div>Admin Panel</div>
      </div>

      <button class="btn btn-danger" onclick="logout()">
        Logout
      </button>
    </div>

    <div class="stats">
      <div class="stat">
        <small>Total Students</small>
        <h2 id="totalStudents">0</h2>
      </div>

      <div class="stat">
        <small>Today's Attendance</small>
        <h2 id="todayAttendance">0</h2>
      </div>
    </div>

    <div class="card">
      <h3>Add Student</h3>

      <input id="studentName" placeholder="Student Name">

      <input id="studentPhone" placeholder="Phone Number">

      <input id="studentId" placeholder="Student ID">

      <button class="btn btn-success" onclick="saveStudent()">
        Save Student
      </button>
    </div>

    <div class="card">
      <h3>Students</h3>

      <div style="overflow:auto">
        <table>
          <thead>
            <tr>
              <th>Name</th>
              <th>Phone</th>
              <th>ID</th>
              <th>Action</th>
            </tr>
          </thead>

          <tbody id="studentTable"></tbody>
        </table>
      </div>
    </div>

    <div class="card">
      <h3>Attendance Log</h3>

      <div style="overflow:auto">
        <table>
          <thead>
            <tr>
              <th>Name</th>
              <th>Date</th>
              <th>Time</th>
            </tr>
          </thead>

          <tbody id="attendanceTable"></tbody>
        </table>
      </div>
    </div>

  </div>
</div>


<!-- ATTENDANCE PANEL -->
<div id="kioskPanel" class="hidden">

  <div class="container">

    <div class="header">
      <div>
        <h2>Savitri Success Library</h2>
        <div>Attendance</div>
      </div>

      <button class="btn btn-danger" onclick="logout()">
        Exit
      </button>
    </div>

    <div class="card" style="text-align:center">

      <h2>Mark Attendance</h2>

      <video id="camera" autoplay playsinline></video>

      <br>

      <button class="btn btn-success" onclick="startCamera()">
        Start Camera
      </button>

      <button class="btn btn-secondary" onclick="markAttendance()">
        Mark Attendance
      </button>

      <p id="attendanceMessage"></p>

    </div>

    <div class="card">
      <h3>Students</h3>

      <div style="overflow:auto">
        <table>
          <thead>
            <tr>
              <th>Name</th>
              <th>Student ID</th>
              <th>Action</th>
            </tr>
          </thead>

          <tbody id="kioskStudentTable"></tbody>
        </table>
      </div>
    </div>

  </div>

</div>


<div id="toast" class="toast"></div>


<script type="module">

import { initializeApp }
from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";

import {
  getDatabase,
  ref,
  set,
  push,
  onValue,
  remove
}
from "https://www.gstatic.com/firebasejs/10.8.0/firebase-database.js";


/* =========================
   FIREBASE CONFIG
========================= */

const firebaseConfig = {
  apiKey: "AIzaSyD6K4XYLzmvUF-qfm_6YM4vATwKfQQ5ZVA",
  authDomain: "savitri-library.firebaseapp.com",
  databaseURL: "https://savitri-library-default-rtdb.asia-southeast1.firebasedatabase.app",
  projectId: "savitri-library",
  storageBucket: "savitri-library.firebasestorage.app",
  messagingSenderId: "77666381914",
  appId: "1:77666381914:web:3fcedc130fc706c6416863",
  measurementId: "G-28RJRZTD78"
};

const app = initializeApp(firebaseConfig);

const db = getDatabase(app);


/* =========================
   PASSWORDS
========================= */

const ADMIN_PASSWORD = "Mona@2000";

const ATTENDANCE_PASSWORD = "Mona@1996";


/* =========================
   GLOBAL DATA
========================= */

let students = {};

let attendance = {};

let currentStudentForAttendance = null;

let cameraStream = null;


/* =========================
   TOAST
========================= */

function showToast(message){

  const toast = document.getElementById("toast");

  toast.innerText = message;

  toast.style.display = "block";

  setTimeout(()=>{
    toast.style.display = "none";
  },2500);
}


/* =========================
   ADMIN LOGIN
========================= */

window.enterAdminMode = function(){

  const password = prompt("Admin Panel Password:");

  if(password !== ADMIN_PASSWORD){

    if(password !== null){

      showToast("Wrong Admin password");

    }

    return;
  }

  document.getElementById("modeScreen")
    .classList.add("hidden");

  document.getElementById("adminPanel")
    .classList.remove("hidden");

  document.getElementById("kioskPanel")
    .classList.add("hidden");

  loadData();
};


/* =========================
   ATTENDANCE LOGIN
========================= */

window.enterKioskMode = async function(){

  const password = prompt("Attendance Password:");

  if(password !== ATTENDANCE_PASSWORD){

    if(password !== null){

      showToast("Wrong Attendance password");

    }

    return;
  }

  document.getElementById("modeScreen")
    .classList.add("hidden");

  document.getElementById("adminPanel")
    .classList.add("hidden");

  document.getElementById("kioskPanel")
    .classList.remove("hidden");

  loadData();

  setTimeout(startCamera,500);
};


/* =========================
   LOGOUT
========================= */

window.logout = function(){

  if(cameraStream){

    cameraStream.getTracks().forEach(track=>{
      track.stop();
    });

    cameraStream = null;
  }

  document.getElementById("adminPanel")
    .classList.add("hidden");

  document.getElementById("kioskPanel")
    .classList.add("hidden");

  document.getElementById("modeScreen")
    .classList.remove("hidden");
};


/* =========================
   LOAD DATA
========================= */

function loadData(){

  onValue(
    ref(db,"students"),
    snapshot=>{

      students = snapshot.val() || {};

      renderStudents();

      renderKioskStudents();

      document.getElementById("totalStudents")
        .innerText = Object.keys(students).length;

    },
    error=>{

      console.error(error);

      showToast("Firebase students load error");

    }
  );


  onValue(
    ref(db,"attendance"),
    snapshot=>{

      attendance = snapshot.val() || {};

      renderAttendance();

      updateTodayCount();

    },
    error=>{

      console.error(error);

      showToast("Firebase attendance load error");

    }
  );
}


/* =========================
   SAVE STUDENT
========================= */

window.saveStudent = async function(){

  const name =
    document.getElementById("studentName").value.trim();

  const phone =
    document.getElementById("studentPhone").value.trim();

  const studentId =
    document.getElementById("studentId").value.trim();


  if(!name){

    showToast("Student name required");

    return;
  }


  try{

    const studentRef = push(ref(db,"students"));

    await set(studentRef,{

      name:name,

      phone:phone,

      studentId:studentId,

      createdAt:Date.now()

    });


    document.getElementById("studentName").value = "";

    document.getElementById("studentPhone").value = "";

    document.getElementById("studentId").value = "";


    showToast("Student saved successfully");

  }

  catch(error){

    console.error(error);

    showToast(
      "Student save failed: " + error.message
    );

  }

};


/* =========================
   RENDER STUDENTS
========================= */

function renderStudents(){

  const table =
    document.getElementById("studentTable");

  table.innerHTML = "";


  Object.entries(students).forEach(
    ([key,student])=>{

      const tr =
        document.createElement("tr");


      tr.innerHTML = `

        <td>${escapeHtml(student.name || "")}</td>

        <td>${escapeHtml(student.phone || "")}</td>

        <td>${escapeHtml(student.studentId || "")}</td>

        <td>

          <button
            class="btn btn-danger"
            onclick="deleteStudent('${key}')">

            Delete

          </button>

        </td>

      `;


      table.appendChild(tr);

    }
  );
}


/* =========================
   KIOSK STUDENTS
========================= */

function renderKioskStudents(){

  const table =
    document.getElementById("kioskStudentTable");

  table.innerHTML = "";


  Object.entries(students).forEach(
    ([key,student])=>{

      const tr =
        document.createElement("tr");


      tr.innerHTML = `

        <td>${escapeHtml(student.name || "")}</td>

        <td>${escapeHtml(student.studentId || "")}</td>

        <td>

          <button
            class="btn btn-success"
            onclick="selectStudent('${key}')">

            Mark

          </button>

        </td>

      `;


      table.appendChild(tr);

    }
  );
}


/* =========================
   DELETE STUDENT
========================= */

window.deleteStudent = async function(key){

  if(!confirm("Delete this student?")){

    return;

  }


  try{

    await remove(ref(db,"students/"+key));

    showToast("Student deleted");

  }

  catch(error){

    console.error(error);

    showToast("Delete failed");

  }

};


/* =========================
   SELECT STUDENT
========================= */

window.selectStudent = function(key){

  currentStudentForAttendance = key;

  const student = students[key];

  document.getElementById(
    "attendanceMessage"
  ).innerText =
    "Selected: " + (student.name || "");

};


/* =========================
   CAMERA
========================= */

window.startCamera = async function(){

  try{

    cameraStream =
      await navigator.mediaDevices.getUserMedia({

        video:true,

        audio:false

      });


    const video =
      document.getElementById("camera");

    video.srcObject = cameraStream;

  }

  catch(error){

    console.error(error);

    showToast(
      "Camera permission allow karo"
    );

  }

};


/* =========================
   MARK ATTENDANCE
========================= */

window.markAttendance = async function(){

  if(!currentStudentForAttendance){

    showToast("Pehle student select karo");

    return;

  }


  const student =
    students[currentStudentForAttendance];


  if(!student){

    showToast("Student not found");

    return;

  }


  const now = new Date();

  const date =
    now.toISOString().split("T")[0];

  const time =
    now.toLocaleTimeString();


  try{

    const attendanceRef =
      push(ref(db,"attendance"));


    await set(attendanceRef,{

      studentKey:currentStudentForAttendance,

      name:student.name || "",

      studentId:student.studentId || "",

      date:date,

      time:time,

      timestamp:Date.now()

    });


    document.getElementById(
      "attendanceMessage"
    ).innerText =
      "Attendance marked for " +
      student.name;


    showToast("Attendance marked");

  }

  catch(error){

    console.error(error);

    showToast(
      "Attendance failed: " + error.message
    );

  }

};


/* =========================
   ATTENDANCE TABLE
========================= */

function renderAttendance(){

  const table =
    document.getElementById("attendanceTable");

  table.innerHTML = "";


  const list =
    Object.values(attendance)
      .sort((a,b)=>
        (b.timestamp || 0) -
        (a.timestamp || 0)
      );


  list.forEach(item=>{

    const tr =
      document.createElement("tr");


    tr.innerHTML = `

      <td>${escapeHtml(item.name || "")}</td>

      <td>${escapeHtml(item.date || "")}</td>

      <td>${escapeHtml(item.time || "")}</td>

    `;


    table.appendChild(tr);

  });

}


/* =========================
   TODAY COUNT
========================= */

function updateTodayCount(){

  const today =
    new Date()
      .toISOString()
      .split("T")[0];


  const count =
    Object.values(attendance)
      .filter(item =>
        item.date === today
      ).length;


  document.getElementById(
    "todayAttendance"
  ).innerText = count;

}


/* =========================
   HTML ESCAPE
========================= */

function escapeHtml(value){

  return String(value)
    .replace(/&/g,"&amp;")
    .replace(/</g,"&lt;")
    .replace(/>/g,"&gt;")
    .replace(/"/g,"&quot;")
    .replace(/'/g,"&#039;");

}

</script>

</body>
</html>
